name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ausführungsrechte für Gradle vergeben
        run: chmod +x gradlew
        working-directory: ./nom-du-dossier  # Remplacez par le chemin du dossier ou supprimez si à la racine

      - name: Debug-APK mit Gradle erstellen
        run: ./gradlew assembleDebug
        working-directory: ./nom-du-dossier  # Remplacez par le chemin du dossier ou supprimez si à la racine

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
